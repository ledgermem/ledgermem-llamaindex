[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-vector-stores-getmnemo"
version = "0.1.0"
description = "LlamaIndex vector store and retriever backed by Mnemo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mnemo", email = "founders@getmnemo.xyz" }]
keywords = ["getmnemo", "llamaindex", "llama-index", "vector-store", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "getmnemo>=0.1",
  "llama-index-core>=0.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/getmnemo/getmnemo-llamaindex"
Issues = "https://github.com/getmnemo/getmnemo-llamaindex/issues"
Source = "https://github.com/getmnemo/getmnemo-llamaindex"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_index_vector_stores_getmnemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
